services:
  kasm-manager:
    build: .
    container_name: kasm-manager
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
      GITHUB_ALLOWED_USERS: ${GITHUB_ALLOWED_USERS:-}
      GITHUB_ALLOWED_EMAILS: ${GITHUB_ALLOWED_EMAILS:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      FORCE_SECURE_COOKIES: ${FORCE_SECURE_COOKIES:-false}
      GITHUB_ALLOWED_ORG: ${GITHUB_ALLOWED_ORG:-}
      GITHUB_ALLOWED_TEAM: ${GITHUB_ALLOWED_TEAM:-}
      GITHUB_ADMIN_USERS: ${GITHUB_ADMIN_USERS:-}
      ENABLE_REVERSE_PROXY_AUTH: ${ENABLE_REVERSE_PROXY_AUTH:-false}
      REVERSE_PROXY_USER_HEADER: ${REVERSE_PROXY_USER_HEADER:-x-forwarded-user}
      REVERSE_PROXY_REQUIRED_VALUE: ${REVERSE_PROXY_REQUIRED_VALUE:-}
      REVERSE_PROXY_SHARED_SECRET: ${REVERSE_PROXY_SHARED_SECRET:-}
      REVERSE_PROXY_SECRET_HEADER: ${REVERSE_PROXY_SECRET_HEADER:-x-kasm-proxy-secret}
      PASSWORD_ENV_KEY: ${PASSWORD_ENV_KEY:-VNC_PW}
      DEFAULT_INTERNAL_PORT: ${DEFAULT_INTERNAL_PORT:-6901/tcp}
      DEFAULT_NETWORK_MODE: ${DEFAULT_NETWORK_MODE:-bridge}
      DEFAULT_PROFILE_MOUNT_PATH: ${DEFAULT_PROFILE_MOUNT_PATH:-/home/kasm-user}
      INSTANCE_NAME_PREFIX: ${INSTANCE_NAME_PREFIX:-kasm-desktop-}
      PROFILE_VOLUME_PREFIX: ${PROFILE_VOLUME_PREFIX:-kasm-profile-}
      MANAGED_LABEL: ${MANAGED_LABEL:-com.egli.kasm-manager.managed}
      PORT_RANGE_START: ${PORT_RANGE_START:-6901}
      PORT_RANGE_END: ${PORT_RANGE_END:-6999}
      MAX_INSTANCES: ${MAX_INSTANCES:-10}
      DESKTOP_HOSTNAME_TEMPLATE: ${DESKTOP_HOSTNAME_TEMPLATE:-}
      PROXY_TARGET_HOST: ${PROXY_TARGET_HOST:-host.docker.internal}
      PROXY_UPSTREAM_HTTPS: ${PROXY_UPSTREAM_HTTPS:-true}
      PROXY_UPSTREAM_USER: ${PROXY_UPSTREAM_USER:-kasm_user}
      PROXY_TEXT_REWRITE: ${PROXY_TEXT_REWRITE:-true}
      LAUNCH_AUTOCONNECT: ${LAUNCH_AUTOCONNECT:-true}
      LAUNCH_RESIZE: ${LAUNCH_RESIZE:-remote}
      LAUNCH_VIEW_ONLY: ${LAUNCH_VIEW_ONLY:-false}
      LAUNCH_INCLUDE_PASSWORD: ${LAUNCH_INCLUDE_PASSWORD:-true}
      LAUNCH_TOKEN_TTL_SECONDS: ${LAUNCH_TOKEN_TTL_SECONDS:-120}
      ALLOW_CUSTOM_BINDS: ${ALLOW_CUSTOM_BINDS:-false}
      ALLOWED_BIND_PREFIXES: ${ALLOWED_BIND_PREFIXES:-}
      ALLOWED_NETWORK_MODES: ${ALLOWED_NETWORK_MODES:-bridge,none}
      DEFAULT_CPU_LIMIT: ${DEFAULT_CPU_LIMIT:-}
      DEFAULT_MEMORY_LIMIT: ${DEFAULT_MEMORY_LIMIT:-}
      DEFAULT_SHM_SIZE: ${DEFAULT_SHM_SIZE:-2g}
      DEFAULT_PIDS_LIMIT: ${DEFAULT_PIDS_LIMIT:-}
      DOCKER_TIMEOUT_MS: ${DOCKER_TIMEOUT_MS:-60000}
      DOCKER_PULL_TIMEOUT_MS: ${DOCKER_PULL_TIMEOUT_MS:-1200000}
      IDLE_TIMEOUT_MINUTES: ${IDLE_TIMEOUT_MINUTES:-0}
      IMAGE_PRESETS_FILE: /app/data/image-presets.json
      DATA_FILE: /app/data/instances.json
      AUDIT_LOG_FILE: /app/data/audit.log
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - /proc:/host/proc:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
